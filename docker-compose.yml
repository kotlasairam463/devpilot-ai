services:

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: devpilot-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: devpilot-backend
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
    env_file:
      - .env
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app

  # Angular Frontend
  frontend:
    build: ./frontend
    container_name: devpilot-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  mongo_data: